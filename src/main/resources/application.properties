spring.application.name=e-comerce

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (HS512 requires minimum 512 bits / 64 characters)
jwt.secret=mySecretKeyForJWTTokenGenerationThatIsSecureEnoughForHS512AlgorithmAndMeetsThe512BitRequirement
jwt.expiration=86400000

# Server Configuration
server.port=8080

